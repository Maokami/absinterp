name: Staged work item
description: Define one scoped milestone for incremental implementation.
title: "feat: "
labels: ["feature", "staged"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What concrete capability must exist after this issue is done?
      placeholder: Add core soundness interface with gamma-based direction.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List exact files/modules to touch and what to add in each.
      placeholder: |
        - AbsInterpLTS/Core/Soundness.lean: add `Sound` predicate
        - Tests/Core/Smoke.lean: add one smoke theorem using new predicate
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Explicitly state what this issue does not implement.
      placeholder: No domain-specific transfer functions; no convergence proofs.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Measurable completion criteria.
      placeholder: |
        - `lake build` succeeds
        - `lake build Tests` succeeds
        - `lake test` succeeds
        - new API documented with module-level comments
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Paper sections, CSLib modules, or prior issues.
      placeholder: |
        - Cousot & Cousot 1992, Sec. 4
        - Cslib.Foundations.Semantics.LTS.Basic
