name: Build/test regression
description: Report a reproducible regression in staged implementation.
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-paragraph description of the defect.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Exact commands and environment details.
      placeholder: |
        - branch: issue-7-core-lts-post
        - command: lake build
        - observed failure: ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Fix acceptance criteria
      description: Conditions that must hold after fix.
      placeholder: |
        - failing build/test command passes
        - regression test added
    validations:
      required: true
