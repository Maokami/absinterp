name: Docs Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Single in-flight deploy, cancel stale runs on the same ref.
concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify Lean toolchain
        run: |
          lean --version
          lake --version

      - name: Resolve Verso dependency
        run: lake update verso

      - name: Build docs project
        run: lake build

      - name: Build documentation site
        run: lake exe site

      - name: Build slide deck
        run: lake exe slides

      - name: Collect publishable HTML
        run: |
          mkdir -p _publish
          # Site (multi-page HTML) becomes the root of the deployed site.
          cp -R _out/html-multi/. _publish/
          # Slides ship as a single-file deck under /slides/.
          mkdir -p _publish/slides
          cp -R _out/slides/html-single/. _publish/slides/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/_publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
