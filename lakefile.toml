name = "absinterp-lts"
version = "0.1.0"
defaultTargets = ["AbsInterpLTS"]
testDriver = "runTests"

[leanOptions]
pp.unicode.fun = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.28.0-rc1"

[[require]]
name = "cslib"
scope = "leanprover"
rev = "v4.28.0-rc1"

[[lean_lib]]
name = "AbsInterpLTS"

[[lean_lib]]
name = "Tests"

[[lean_exe]]
name = "runTests"
srcDir = "scripts"
root = "RunTests"
